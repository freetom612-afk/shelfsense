<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<script src="assets/auth.js"></script>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#0B1220"/>
<title>ShelfSense — מצב בישול</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="assets/data.js"></script>
<script src="assets/state.js"></script>
<script src="assets/recipes.js"></script>
<script src="assets/cook-steps.js"></script>
<style>
  :root { --bg: #0B1220; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12); --text: #F8FAFC; --muted: #94A3B8; --accent: #34D399; --accent-soft: rgba(52,211,153,.16); --primary: #0F766E; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { font-family: 'Rubik', sans-serif; background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; overflow-x: hidden;
    background-image: radial-gradient(900px 420px at 50% -120px, var(--accent-soft), transparent 70%), radial-gradient(600px 300px at 100% 100%, rgba(15,118,110,.18), transparent 70%);
    transition: background-image .5s; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24; line-height: 1; vertical-align: middle; }
  button { font-family: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app { min-height: 100dvh; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px 0; overflow-x: clip; }
  .app > * { min-width: 0; }
  /* header */
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; color: var(--text); text-decoration: none; flex-shrink: 0; transition: background .2s, border-color .2s; }
  .icon-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .icon-btn:active { transform: scale(.94); }
  .ttl { flex: 1; min-width: 0; }
  .ttl .dish { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl .sub { font-size: 13px; color: var(--muted); }
  /* progress */
  .segs { display: flex; gap: 6px; padding: 4px 0 10px; }
  .seg { flex: 1; height: 6px; border-radius: 9999px; background: rgba(255,255,255,.14); overflow: hidden; border: 0; padding: 0; }
  .seg i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9999px; transition: width .4s; }
  .seg.done i { width: 100%; } .seg.cur i { width: 55%; }

  /* stage (animated scene) */
  .stage { position: relative; height: clamp(170px, 30dvh, 250px); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
  .stage .halo { position: absolute; inset: 8% 14%; border-radius: 50%; background: radial-gradient(closest-side, var(--accent-soft), transparent 72%); filter: blur(4px); animation: halo 3.2s ease-in-out infinite; }
  .stage svg { position: relative; width: min(100%, 360px); height: 100%; overflow: visible; animation: pop .45s cubic-bezier(.2,.9,.3,1.2); }
  .stage .badge { position: absolute; top: 4px; inset-inline-start: 0; display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px 5px 10px; border-radius: 9999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }

  /* content */
  .content { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; animation: slide .35s ease both; }
  .content.back { animation-name: slideBack; }
  h1.step-title { font-size: clamp(24px, 6vw, 32px); font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
  .step-body { font-size: clamp(19px, 4.6vw, 23px); line-height: 1.65; color: #E2E8F0; }
  .tip { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.3); color: #FDE68A; font-size: 15px; line-height: 1.5; }
  .tip .material-symbols-outlined { color: #FBBF24; font-size: 22px; flex-shrink: 0; }

  /* timer */
  .timer { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
  .ring { position: relative; width: 116px; height: 116px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.12); } .ring .bar { stroke: var(--accent); transition: stroke-dashoffset .3s linear, stroke .3s; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--accent)); }
  .ring .digits { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
  .ring .digits small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .timer.running .ring { animation: breathe 2s ease-in-out infinite; }
  .timer.done .ring .bar { stroke: #F59E0B; } .timer.done .ring { animation: ding .7s ease-in-out infinite; }
  .t-ctrl { flex: 1; min-width: 0; display: grid; gap: 8px; }
  .btn { height: 52px; border-radius: 14px; font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; white-space: nowrap; min-width: 0; transition: transform .12s, filter .2s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: #052E26; box-shadow: 0 8px 24px -8px var(--accent); }
  .btn.ghost { background: var(--card); border: 1px solid var(--line); color: var(--text); font-weight: 600; font-size: 15px; height: 44px; padding: 0 8px; }
  .t-ctrl .btn.primary { height: 50px; font-size: 16px; }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ingredients */
  .ing-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .seg-ctl { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .seg-ctl button { padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg-ctl button[aria-checked="true"] { background: var(--accent); color: #052E26; }
  .ing-prog { height: 8px; border-radius: 9999px; background: rgba(255,255,255,.12); overflow: hidden; }
  .ing-prog i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9999px; transition: width .3s; }
  .ing-list { display: grid; gap: 8px; list-style: none; }
  .ing { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 17px; transition: background .2s, opacity .2s; }
  .ing .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid rgba(255,255,255,.35); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
  .ing .box .material-symbols-outlined { font-size: 20px; color: #052E26; opacity: 0; transform: scale(.4); transition: all .2s; }
  .ing[aria-checked="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .ing[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
  .ing[aria-checked="true"] .box .material-symbols-outlined { opacity: 1; transform: scale(1); }
  .ing[aria-checked="true"] .nm { text-decoration: line-through; opacity: .6; }
  .ing .nm { flex: 1; } .ing .qty { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .ing.pantry .qty { color: var(--muted); font-weight: 500; }
  .grp { font-size: 13px; color: var(--muted); font-weight: 600; margin: 6px 2px 0; }

  /* dock of running timers */
  .dock { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px 7px 14px; border-radius: 9999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  .chip .dotl { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .chip.done { border-color: #F59E0B; color: #FCD34D; } .chip.done .dotl { background: #F59E0B; }
  .chip.paused .dotl { animation: none; background: var(--muted); }

  /* footer nav */
  .nav { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .nav .btn { height: 58px; font-size: 18px; }

  /* alert banner */
  .alert { position: fixed; top: 10px; inset-inline: 12px; z-index: 50; max-width: 736px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #F59E0B; color: #1F1300; font-weight: 700; box-shadow: 0 16px 40px -10px rgba(245,158,11,.6); animation: drop .4s cubic-bezier(.2,.9,.3,1.2); }
  .alert[hidden] { display: none; }
  .alert .material-symbols-outlined { font-size: 28px; animation: ding .6s infinite; }
  .alert .msg { flex: 1; } .alert button { padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.14); font-weight: 700; }

  /* finish screen */
  .finish { text-align: center; align-items: center; justify-content: center; }
  .trophy { width: 140px; height: 140px; margin: 10px auto 0; filter: drop-shadow(0 12px 30px rgba(251,191,36,.4)); animation: pop .6s cubic-bezier(.2,.9,.3,1.4); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
  .stat { padding: 14px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .stat b { display: block; font-size: 24px; } .stat span { font-size: 13px; color: var(--muted); }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
  .confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }

  .err { margin: auto; text-align: center; max-width: 420px; display: grid; gap: 14px; }

  /* ---- scene animation classes ---- */
  .steam { animation: steam 2.6s ease-in infinite; opacity: 0; transform-box: fill-box; transform-origin: center bottom; } .steam.s2 { animation-delay: .8s; } .steam.s3 { animation-delay: 1.6s; }
  .bub { animation: bubble 1.8s ease-in infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .bub.b2 { animation-delay: .5s; } .bub.b3 { animation-delay: 1s; } .bub.b4 { animation-delay: 1.4s; }
  .flame { animation: flame .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; } .flame.f2 { animation-delay: .15s; } .flame.f3 { animation-delay: .3s; }
  .spark { animation: spark 1.1s ease-out infinite; opacity: 0; } .spark.k2 { animation-delay: .3s; } .spark.k3 { animation-delay: .6s; } .spark.k4 { animation-delay: .85s; }
  .knife { animation: chop .7s ease-in-out infinite; transform-box: view-box; transform-origin: 232px 70px; }
  .pc { animation: piece .7s ease-out infinite; transform-box: fill-box; transform-origin: center; } .pc.p2 { animation-delay: .12s; } .pc.p3 { animation-delay: .24s; }
  .glow { animation: ovenGlow 2.2s ease-in-out infinite; } .wave { animation: wave 2s ease-in-out infinite; opacity: 0; } .wave.w2 { animation-delay: .6s; } .wave.w3 { animation-delay: 1.2s; }
  .spoon { animation: stir 2.2s linear infinite; transform-box: view-box; transform-origin: 160px 128px; }
  .lid { animation: lid 2.4s ease-in-out infinite; transform-box: fill-box; } .lid.l2 { animation-delay: .35s; } .lid.l3 { animation-delay: .7s; }
  .tick { animation: tick 2.4s ease-out infinite; opacity: 0; transform-box: fill-box; transform-origin: center; } .tick.t2 { animation-delay: .35s; } .tick.t3 { animation-delay: .7s; }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .twinkle.w2 { animation-delay: .5s; } .twinkle.w3 { animation-delay: 1s; }

  @keyframes halo { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes pop { from { transform: scale(.82); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slide { from { transform: translateX(-22px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slideBack { from { transform: translateX(22px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes steam { 0% { transform: translateY(0) scaleX(.8); opacity: 0; } 25% { opacity: .75; } 100% { transform: translateY(-38px) scaleX(1.25); opacity: 0; } }
  @keyframes bubble { 0% { transform: translateY(6px) scale(.5); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-16px) scale(1.15); opacity: 0; } }
  @keyframes flame { from { transform: scaleY(.8) skewX(-4deg); } to { transform: scaleY(1.18) skewX(4deg); } }
  @keyframes spark { 0% { transform: translate(0,0) scale(1); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx,10px), -46px) scale(.3); opacity: 0; } }
  @keyframes chop { 0%,100% { transform: rotate(-14deg); } 45% { transform: rotate(8deg); } }
  @keyframes piece { 0%,40% { transform: translateY(0) rotate(0); } 60% { transform: translateY(-12px) rotate(25deg); } 100% { transform: translateY(0) rotate(0); } }
  @keyframes ovenGlow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  @keyframes wave { 0% { transform: translateY(8px); opacity: 0; } 40% { opacity: .6; } 100% { transform: translateY(-14px); opacity: 0; } }
  @keyframes stir { to { transform: rotate(360deg); } }
  @keyframes lid { 0%,15% { transform: translateY(-34px); } 35%,100% { transform: translateY(0); } }
  @keyframes tick { 0%,35% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.25); opacity: 1; } 65%,100% { transform: scale(1); opacity: 1; } }
  @keyframes twinkle { 0%,100% { transform: scale(.4) rotate(0); opacity: .3; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
  @keyframes ding { 0%,100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-8deg) scale(1.06); } 40% { transform: rotate(8deg) scale(1.06); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(4deg); } }
  @keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes fall { to { transform: translate3d(var(--x, 0), 105vh, 0) rotate(var(--r, 540deg)); opacity: .9; } }

  @media (min-width: 720px) {
    .app { padding-inline: 28px; }
    .timer { padding: 22px; } .ring { width: 156px; height: 156px; } .ring .digits { font-size: 38px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- shared gradients for the animated scenes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="cx-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F5F9"/><stop offset=".5" stop-color="#A8B4C4"/><stop offset="1" stop-color="#64748B"/></linearGradient>
  <linearGradient id="cx-pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E2E8F0"/><stop offset=".4" stop-color="#94A3B8"/><stop offset="1" stop-color="#475569"/></linearGradient>
  <linearGradient id="cx-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2AE72"/><stop offset="1" stop-color="#B07A44"/></linearGradient>
  <linearGradient id="cx-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#DC2626"/><stop offset=".55" stop-color="#F97316"/><stop offset="1" stop-color="#FDE047"/></linearGradient>
  <linearGradient id="cx-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
  <linearGradient id="cx-oven" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4658"/><stop offset="1" stop-color="#1E2735"/></linearGradient>
  <radialGradient id="cx-hot" cx=".5" cy=".6" r=".7"><stop offset="0" stop-color="#FFD27A"/><stop offset=".55" stop-color="#F97316"/><stop offset="1" stop-color="#9A2A0A"/></radialGradient>
  <radialGradient id="cx-food" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#F4B183"/><stop offset=".6" stop-color="#C9733E"/><stop offset="1" stop-color="#7A3E1B"/></radialGradient>
  <radialGradient id="cx-plate" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CBD5E1"/></radialGradient>
  <linearGradient id="cx-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E0F2FE" stop-opacity=".9"/><stop offset="1" stop-color="#7DD3FC" stop-opacity=".45"/></linearGradient>
  <linearGradient id="cx-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FEF08A"/><stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#B45309"/></linearGradient>
</defs></svg>

<div class="alert" id="alert" role="alert" hidden>
  <span class="material-symbols-outlined">alarm_on</span><span class="msg" id="alert-msg"></span><button type="button" id="alert-go">למעבר</button>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="app" id="app">
  <header class="top">
    <a class="icon-btn" id="close" href="dashboard.html" aria-label="יציאה ממצב בישול"><span class="material-symbols-outlined">close</span></a>
    <div class="ttl"><div class="dish" id="dish-name">מצב בישול</div><div class="sub" id="step-count"></div></div>
    <button class="icon-btn" id="btn-voice" type="button" aria-pressed="false" aria-label="הקראת השלבים בקול" title="הקראה בקול"><span class="material-symbols-outlined">volume_off</span></button>
    <button class="icon-btn" id="btn-wake" type="button" aria-pressed="false" aria-label="השארת המסך דלוק" title="מסך דלוק"><span class="material-symbols-outlined">light_mode</span></button>
  </header>
  <div class="segs" id="segs" role="progressbar" aria-label="התקדמות בבישול"></div>
  <div class="stage" id="stage"></div>
  <main class="content" id="content"></main>
  <div class="dock" id="dock" aria-label="טיימרים פעילים"></div>
  <nav class="nav" id="nav">
    <button class="btn ghost" id="btn-prev" type="button"><span class="material-symbols-outlined">arrow_forward</span>הקודם</button>
    <button class="btn primary" id="btn-next" type="button">הבא<span class="material-symbols-outlined">arrow_back</span></button>
  </nav>
</div>

<script>
(function () {
  const D = window.ShelfSenseData, SS = window.ShelfSense, Cook = window.ShelfSenseCook;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  // ---------- what are we cooking ----------
  const params = new URLSearchParams(location.search);
  const dishId = D.DISHES[params.get('dish')] ? params.get('dish') : null;
  if (!dishId) {
    $('content').innerHTML = `<div class="err"><span class="material-symbols-outlined" style="font-size:54px;color:#F59E0B">search_off</span><h1 class="step-title">לא נמצאה מנה</h1><a class="btn primary" href="dashboard.html" style="text-decoration:none">לתפריט השבועי</a></div>`;
    $('nav').hidden = true; $('segs').hidden = true;
    return;
  }
  const dish = D.DISHES[dishId];
  const steps = Cook.stepsFor(dishId);
  const slot = D.SLOTS[params.get('slot')];
  let portions = Number(params.get('portions')) || (slot ? slot.servings : (dish.type === 'anchor' ? 3 : 1));
  if (![1, 2, 3, 4, 5].includes(portions)) portions = 3;
  $('dish-name').textContent = dish.name;
  $('close').href = 'recipe.html?dish=' + encodeURIComponent(dishId) + (slot ? '&slot=' + params.get('slot') : '');
  document.title = 'ShelfSense — בישול: ' + dish.name;

  // screens: 0 = ingredients, 1..N = steps, N+1 = finished
  const N = steps.length;
  const LAST = N + 1;
  const KEY = `shelfsense_cook:${dishId}`;
  const saved = (() => { try { return JSON.parse(sessionStorage.getItem(KEY)); } catch (e) { return null; } })();
  const st = Object.assign({ i: 0, timers: {}, checked: {}, startedAt: Date.now(), voice: false, wake: true }, saved || {});
  st.portions = portions;
  const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* ignore */ } };

  // ---------- accent colour + animated scene per kind ----------
  const ACCENT = { prep: '#34D399', boil: '#38BDF8', sear: '#FB923C', bake: '#FBBF24', mix: '#A78BFA', pack: '#2DD4BF', serve: '#FACC15', done: '#FBBF24' };

    try {
      ensureAudio(); if (!audio) return;

        const o = audio.createOscillator(), g = audio.createGain();

        g.gain.setValueAtTime(0.0001, audio.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.35, audio.currentTime + d + 0.02);

      <h1 class="step-title">${esc(s.title)}</h1>
      <p class="step-body">${esc(s.body)}</p>
      ${s.tip ? `<div class="tip"><span class="material-symbols-outlined">tips_and_updates</span><span>${esc(s.tip)}</span></div>` : ''}
      ${s.min ? '<div id="timer-slot"></div>' : ''}`;
    if (s.min) renderTimerPanel();
  }

  function renderTimerPanel() {
    const slotEl = $('timer-slot');
    if (!slotEl || st.i < 1 || st.i > N) return;
    const s = steps[st.i - 1], t = st.timers[st.i];
    const status = t ? t.status : 'idle';
    const total = t ? t.total : s.min * 60;
    const left = t ? leftOf(t) : total;
    const C = 2 * Math.PI * 54;
    slotEl.innerHTML = `<div class="timer ${status}" id="timer-box">
      <div class="ring" role="timer" aria-label="טיימר"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54" fill="none" stroke-width="9"/><circle class="bar" id="ring-bar" cx="60" cy="60" r="54" fill="none" stroke-width="9" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (total ? left / total : 0))}"/></svg>
        <div class="digits"><span id="digits">${mmss(left)}</span><small id="t-status">${status === 'running' ? 'מבשלים...' : status === 'paused' ? 'מושהה' : status === 'done' ? 'הסתיים!' : 'מוכן להתחלה'}</small></div></div>
      <div class="t-ctrl">
        <button type="button" class="btn primary" id="t-main"><span class="material-symbols-outlined">${status === 'running' ? 'pause' : 'play_arrow'}</span>${status === 'running' ? 'השהה' : status === 'idle' ? 'התחל טיימר' : status === 'done' ? 'התחל שוב' : 'המשך'}</button>
        <div class="row2"><button type="button" class="btn ghost" id="t-plus"><span class="material-symbols-outlined">add</span>דקה</button><button type="button" class="btn ghost" id="t-reset" ${t ? '' : 'disabled'}><span class="material-symbols-outlined">restart_alt</span>איפוס</button></div>
      </div></div>`;
    $('t-main').onclick = () => (status === 'running' ? pauseTimer(st.i) : startTimer(st.i));
    $('t-plus').onclick = () => addMinute(st.i);
    $('t-reset').onclick = () => resetTimer(st.i);
  }

  function renderFinish() {
    const mins = Math.max(1, Math.round((Date.now() - st.startedAt) / 60000));
    $('content').className = 'content finish' + (dir < 0 ? ' back' : '');
    $('content').innerHTML = `${TROPHY}
      <h1 class="step-title">בתיאבון! הארוחה מוכנה</h1>
      <p class="step-body" style="font-size:19px">${esc(dish.name)}</p>
      <div class="stats"><div class="stat"><b>${mins}</b><span>דקות בישול</span></div><div class="stat"><b>${st.portions}</b><span>מנות</span></div><div class="stat"><b>${dish.kcal}</b><span>קק״ל למנה</span></div></div>
      <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat" style="color:#6EE7B7"><b>${dish.protein}ג׳</b><span>חלבון</span></div><div class="stat" style="color:#FCD34D"><b>${dish.carbs}ג׳</b><span>פחמימות</span></div><div class="stat" style="color:#FDBA74"><b>${dish.fat}ג׳</b><span>שומן</span></div></div>
      <div class="row2" style="width:100%"><a class="btn ghost" href="dashboard.html" style="text-decoration:none">לתפריט</a><a class="btn primary" href="cart.html" style="text-decoration:none">לסל הקניות</a></div>`;
    confetti();
  }

  function confetti() {
    const box = $('confetti'); box.innerHTML = '';
    const colors = ['#34D399', '#FBBF24', '#38BDF8', '#F472B6', '#A78BFA', '#FB923C'];
    for (let k = 0; k < 70; k++) {
      const el = document.createElement('i');
      el.style.cssText = `left:${Math.random() * 100}%;background:${colors[k % colors.length]};animation-duration:${2.4 + Math.random() * 2.4}s;animation-delay:${Math.random() * .8}s;--x:${(Math.random() * 160 - 80).toFixed(0)}px;--r:${(Math.random() * 900 - 300).toFixed(0)}deg;`;
      box.appendChild(el);
    }
    setTimeout(() => { box.innerHTML = ''; }, 6500);
    try { (buzz() || (() => {}))([80, 60, 80]); } catch (e) { /* ignore */ }
  }

  function renderDock() {
    const chips = Object.keys(st.timers).map(Number).filter((i) => i !== st.i && steps[i - 1]).map((i) => {
      const t = st.timers[i];
      return `<button type="button" class="chip ${t.status}" data-go="${i}" aria-label="טיימר שלב ${i}: ${mmss(leftOf(t))}"><span class="dotl"></span>שלב ${i} · <span data-dock="${i}">${t.status === 'done' ? 'הסתיים' : mmss(leftOf(t))}</span></button>`;
    });
    $('dock').innerHTML = chips.join('');
    $('dock').hidden = !chips.length;
  }

  function render() {
    const kind = st.i === 0 ? 'ing' : st.i > N ? 'done' : steps[st.i - 1].kind;
    setAccent(kind === 'ing' ? 'prep' : kind);
    $('stage').innerHTML = (kind === 'done' ? '' : `<span class="badge"><span class="material-symbols-outlined" style="font-size:18px">${KIND_ICON[kind]}</span>${esc(KIND_NAME[kind])}</span>`) + '<div class="halo"></div>' + (SCENES[kind] || '');
    $('stage').style.display = kind === 'done' ? 'none' : '';
    if (st.i <= N) confetti.innerHTML = '';
    if (st.i === 0) renderIngredients(); else if (st.i > N) renderFinish(); else renderStep();
    renderProgress(); renderDock();
    $('btn-prev').style.visibility = st.i === 0 ? 'hidden' : 'visible';
    $('nav').hidden = st.i > N;
    $('btn-next').innerHTML = st.i === N ? 'סיימתי!<span class="material-symbols-outlined">check</span>' : st.i === 0 ? 'מתחילים לבשל<span class="material-symbols-outlined">arrow_back</span>' : 'הבא<span class="material-symbols-outlined">arrow_back</span>';
    save();
    if (st.i >= 1 && st.i <= N) speak(steps[st.i - 1].title + '. ' + steps[st.i - 1].body); else if (synth) synth.cancel();
    window.scrollTo({ top: 0 });
  }

  function go(i) { const n = Math.max(0, Math.min(LAST, i)); if (n === st.i) return; dir = n > st.i ? 1 : -1; st.i = n; render(); }

  // ---------- events ----------
  $('btn-next').addEventListener('click', () => go(st.i + 1));
  $('btn-prev').addEventListener('click', () => go(st.i - 1));
  document.addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]'); if (g) { go(Number(g.dataset.go)); return; }
    const ing = e.target.closest('[data-ing]');
    if (ing) {
      const id = ing.dataset.ing; st.checked[id] = !st.checked[id]; save();
      ing.setAttribute('aria-checked', String(!!st.checked[id]));
      const rows = ingredientRows(), done = rows.filter((r) => st.checked[r.id]).length;
      $('ing-count').textContent = `${done}/${rows.length}`; $('ing-bar').style.width = (rows.length ? done / rows.length * 100 : 0) + '%';
      return;
    }
    const pt = e.target.closest('[data-portions]'); if (pt) { st.portions = Number(pt.dataset.portions); st.checked = {}; save(); renderIngredients(); }
  });
  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') go(st.i + 1);
    else if (e.key === 'ArrowRight') go(st.i - 1);
    else if (e.key === ' ' && st.i >= 1 && st.i <= N && steps[st.i - 1].min && e.target.tagName !== 'BUTTON') {
      e.preventDefault(); const t = st.timers[st.i]; (t && t.status === 'running') ? pauseTimer(st.i) : startTimer(st.i);
    }
  });
  // swipe between steps (left = next)
  let sx = null, sy = null;
  document.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && !e.target.closest('.dock')) go(st.i + (dx < 0 ? 1 : -1));
  }, { passive: true });

  $('btn-voice').addEventListener('click', () => {
    if (!synth) { alert('הדפדפן הזה לא תומך בהקראה.'); return; }
    st.voice = !st.voice; save();
    $('btn-voice').setAttribute('aria-pressed', String(st.voice));
    $('btn-voice').firstElementChild.textContent = st.voice ? 'volume_up' : 'volume_off';
    if (st.voice) { if (!hasHebrewVoice()) alert('לא נמצא קול בעברית במכשיר. ההקראה עשויה להישמע בשפה אחרת.'); if (st.i >= 1 && st.i <= N) speak(steps[st.i - 1].title + '. ' + steps[st.i - 1].body); } else synth.cancel();
  });
  $('btn-wake').addEventListener('click', () => setWake(!st.wake));
  window.addEventListener('beforeunload', () => { if (synth) synth.cancel(); });

  // ---------- clock ----------
  setInterval(() => {
    let changed = false;
    Object.keys(st.timers).forEach((k) => {
      const i = Number(k), t = st.timers[k];
      if (t.status !== 'running') return;
      const left = leftOf(t);
      if (left <= 0) { t.status = 'done'; t.left = 0; changed = true; showAlert(i); return; }
      if (i === st.i) {
        const d = $('digits'), bar = $('ring-bar');
        if (d) d.textContent = mmss(left);
        if (bar) { const C = 2 * Math.PI * 54; bar.style.strokeDashoffset = C * (1 - left / t.total); }
        document.title = `${mmss(left)} · ${steps[i - 1].title}`;
      } else {
        const c = document.querySelector(`[data-dock="${i}"]`); if (c) c.textContent = mmss(left);
      }
    });
    if (changed) { save(); renderDock(); if (st.i >= 1 && st.i <= N) renderTimerPanel(); document.title = 'ShelfSense — מצב בישול'; }
  }, 250);

  // ---------- start ----------
  $('btn-voice').setAttribute('aria-pressed', String(st.voice));
  $('btn-voice').firstElementChild.textContent = st.voice ? 'volume_up' : 'volume_off';
  if (st.i < 0 || st.i > LAST) st.i = 0;
  render();
  setWake(st.wake);
})();
</script>
</body>
</html>
